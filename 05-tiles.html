<style>
  @font-face{font-family:"Resource Han Rounded CN";src:url("assets/fonts/RHR-CN.woff2") format("woff2");font-weight:200 900;font-display:swap}
  :root{
    --font:"Resource Han Rounded CN","Hiragino Maru Gothic ProN","PingFang SC","Microsoft YaHei",sans-serif;
    --bg:#ffe0e5;
    --ink:#4e3a43;
    --ink-2:#7f6570;
    --ink-3:#bd9ea8;
    --rose:#d4637f;
    --rose-d:#b04b66;

  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100svh; color:var(--ink);
    font-family:var(--font);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
    body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:#ffe0e5 url("assets/images/bg-full.jpg") top center / 100% auto no-repeat;
  }

.wrap{max-width:452px; margin:0 auto; padding:calc(100vw / 2.7931 + 16px) 18px 44px}
  @media (min-width:900px){
    .wrap{max-width:560px; padding:calc(100vw / 2.7931 + 24px) 18px 56px}
  }

  header{text-align:center; margin-top:26px}

  .h-av{width:62px; height:62px; border-radius:50%; border:3px solid #fff; object-fit:cover;
    box-shadow:0 8px 16px -10px rgba(150,70,100,.6)}
  .names{text-align:left}
  .furi{
    font-family:var(--font); font-size:12.5px;

  h1{
    margin:2px 0 0; font-size:32px; letter-spacing:.12em; margin-left:.12em;
    font-family:var(--font);
    color:#4b3640;
    text-shadow:0 2px 0 #fff, 3px 4px 0 rgba(255,160,190,.5);
  }
  .sub{display:block; margin-top:7px; font-size:10px; letter-spacing:.3em; color:#c096a6; text-transform:uppercase}
  .bio{text-wrap:balance; margin:12px auto 0; max-width:28ch; font-size:12px; line-height:1.9; color:#846571}
  .tags{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:12px}
  .tags span{
    font-size:11px; padding:4px 10px; border-radius:999px;
    background:#fff; color:#b3556f; box-shadow:0 2px 0 rgba(220,150,175,.28);
  }

  .label{
    display:flex; align-items:center; gap:9px; margin:26px 4px 10px;
    font-size:11px; font-weight:800; letter-spacing:.18em; color:#c0758e;
  }
  .label::after{content:""; flex:1; height:2px; background:repeating-linear-gradient(90deg,#ffc0d0 0 8px, transparent 8px 14px)}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{
    position:relative; display:flex; align-items:center; gap:10px;
    padding:12px 13px; min-height:70px; border-radius:16px;
    text-decoration:none; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.14), 0 12px 20px -16px rgba(120,60,80,.7);
    transition:transform .16s, box-shadow .16s, filter .16s;
  }
  .tile:hover{transform:translateY(-2px); filter:saturate(1.06)}
  .tile:active{transform:translateY(1px); box-shadow:0 2px 0 rgba(0,0,0,.14)}
  .tile:focus-visible{outline:3px solid rgba(255,255,255,.9); outline-offset:2px}
  .tile .ti{
    flex:0 0 auto; width:34px; height:34px; border-radius:11px;
    display:grid; place-items:center; background:rgba(255,255,255,.22);
  }
  .tile b{display:block; font-size:14px; font-weight:800; letter-spacing:.02em; line-height:1.25}
  .tile em{display:block; font-style:normal; font-size:9.5px; opacity:.82; margin-top:2px; letter-spacing:.02em}
  .tile .arrow{position:absolute; right:10px; bottom:9px; width:13px; height:13px; opacity:.55}

  .t-bili{background:linear-gradient(160deg,#6fb0d2,#4f92b8)}
  .t-live{background:linear-gradient(160deg,#f0819d,#dc5f80)}
  .t-yt{background:linear-gradient(160deg,#ec7a6c,#dc5b4e)}
  .t-x{background:linear-gradient(160deg,#5c4f56,#40353b)}
  .t-afd{background:linear-gradient(160deg,#a98cdf,#8b6cc8)}
  .t-fan{background:linear-gradient(160deg,#eab467,#d99a45)}
  .t-booth{background:linear-gradient(160deg,#74b9b3,#57a29c)}

  .support{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:10px}
  .support a{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:12px 4px; border-radius:14px; background:#fff; text-decoration:none;
    color:#8b6270; font-size:11px; box-shadow:0 3px 0 #ffd0dc;
    transition:transform .16s, box-shadow .16s, color .16s;
  }
  .support a:hover{transform:translateY(-2px); color:var(--rose-d); box-shadow:0 5px 0 #ffc6d4}
  .support .i{width:17px; height:17px; color:#e091a8}

  .sites{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .sites a{
    display:flex; align-items:center; gap:8px; padding:11px 12px;
    background:#fff7f9; border-radius:13px; text-decoration:none;
    color:#7c5d69; font-size:12.5px; box-shadow:0 2px 0 #ffd6e0;
    transition:background .18s, color .18s, transform .16s;
  }
  .sites a:hover{background:#fff; color:var(--rose-d); transform:translateY(-1px)}
  .sites .i{width:15px; height:15px; color:#e0a4b6}

  footer{
    margin-top:28px; text-align:center; font-size:10px; color:#c39fae;
    letter-spacing:.05em; line-height:2;
  }
  footer .sep{letter-spacing:.2em; color:#ddb3c1}

  .i{width:18px; height:18px; display:block; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  .sprite{position:absolute; width:0; height:0; overflow:hidden}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
